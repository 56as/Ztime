<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Ztime 页面设计稿</title></head><body class="light" data-accent="blue" style="--accent: #007aff; --tint: color-mix(in srgb, var(--accent) 13%, var(--surface)); --on-accent: #ffffff;"><div id="app"><div class="app-shell"><aside class="sidebar"><div class="brand"><img class="brand-mark" src="./brand-icon.png" alt="" width="31" height="31"><div><strong>Ztime</strong></div></div><nav class="nav"><button data-page="home" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v11H3z M9 21v-8h6v8"></path></svg>今日</button><button data-page="week" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v17H4z M8 2v4 M16 2v4 M4 10h16 M8 14h2 M14 14h2"></path></svg>每周</button><button data-page="devices" class="active"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12H3z M8 21h8 M12 16v5"></path></svg>设备</button><button data-page="settings" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2"></path></svg>设置</button></nav></aside><main><header class="topbar page-header"><div class="page-heading"><h1>设备</h1><div class="statusbar"><span class="state"><span class="dot "></span>正在记录 · 文稿编辑器</span></div></div><div class="actions"><button data-action="refresh"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5 M4 17v-5h5 M6 7a7 7 0 0 1 12-1l2 3 M4 15l2 3a7 7 0 0 0 12-1"></path></svg> 更新</button></div></header><section class="panel"><small class="small">配对流程 · 交互提案</small><h2>添加手机</h2><p>在手机上打开 Ztime，进入「设备」扫描配对码。保持两端连接在同一局域网。</p><p class="small">设计稿示例配对码</p><div class="pair-code">482 106</div><button data-flow="mobile-pair-scan">转到手机画板 →</button></section></main></div></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"><div id="dialogContent"></div></dialog>
