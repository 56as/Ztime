<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Ztime 页面设计稿</title></head><body class="light" data-accent="blue" style="--accent: #007aff; --tint: color-mix(in srgb, var(--accent) 13%, var(--surface)); --on-accent: #ffffff;"><div id="app"><div class="app-shell"><aside class="sidebar"><div class="brand"><img class="brand-mark" src="./brand-icon.png" alt="" width="31" height="31"><div><strong>Ztime</strong></div></div><nav class="nav"><button data-page="home" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v11H3z M9 21v-8h6v8"></path></svg>今日</button><button data-page="week" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v17H4z M8 2v4 M16 2v4 M4 10h16 M8 14h2 M14 14h2"></path></svg>每周</button><button data-page="devices" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12H3z M8 21h8 M12 16v5"></path></svg>设备</button><button data-page="settings" class="active"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2"></path></svg>设置</button></nav></aside><main><header class="topbar page-header"><div class="page-heading"><h1>设置</h1><div class="statusbar"><span class="state"><span class="dot "></span>正在记录 · 文稿编辑器</span></div></div><div class="actions"><button data-action="refresh"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5 M4 17v-5h5 M6 7a7 7 0 0 1 12-1l2 3 M4 15l2 3a7 7 0 0 0 12-1"></path></svg> 更新</button></div></header><div class="settings-grid"><section class="panel settings-section" id="extension-settings"><h2>浏览器识别</h2><p>识别 Windows 前台 Chrome / Edge 网站的域名，并随应用记录同步至已配对设备。</p><button data-action="design-extension">启用并生成连接码</button><p id="design-connection" hidden>连接码示意 · 在扩展弹窗中输入</p>< utton" class="accent-choice" data-accent="purple" aria-pressed="false" aria-label="鸢紫" style="--swatch:#7b50c8;--swatch-dark:#b59bff"><span class="accent-swatch" aria-hidden="true"></span><span>鸢紫</span></button><button type="button" class="accent-choice" data-accent="amber" aria-pressed="false" aria-label="琥珀" style="--swatch:#b96713;--swatch-dark:#ffb15c"><span class="accent-swatch" aria-hidden="true"></span><span>琥珀</span></button><button type="button" class="accent-choice" data-accent="pink" aria-pressed="false" aria-label="玫粉" style="--swatch:#c64e7b;--swatch-dark:#ff8eb4"><span class="accent-swatch" aria-hidden="true"></span><span>玫粉</span></button><button type="button" class="accent-choice" data-accent="teal" aria-pressed="false" aria-label="青碧" style="--swatch:#007f8f;--swatch-dark:#55cbd6"><span class="accent-swatch" aria-hidden="true"></span><span>青碧</span></button><button type="button" class="accent-choice" data-accent="coral" aria-pressed="false" aria-label="珊瑚" style="--swatch:#cb4449;--swatch-dark:#ff8b86"><span class="accent-swatch" aria-hidden="true"></span><span>珊瑚</span></button><button type="button" class="accent-choice" data-accent="graphite" aria-pressed="false" aria-label="石墨" style="--swatch:#62646a;--swatch-dark:#b4b7c0"><span class="accent-swatch" aria-hidden="true"></span><span>石墨</span></button></div></fieldset></div><div id="design-settings-data" class="panel settings-section"><h2>我的数据</h2><p class="small">导出使用记录明细。只想分享统计摘要？请到「每周」导出周报。</p><div class="row"><button data-export="json">导出 JSON</button><button data-export="csv">导出 CSV</button></div><section class="risk-block"><h3>清除历史记录</h3><p>删除会同步到配对设备，无法撤销。</p><button data-action="delete-data" class="danger">删除所有使用记录</button></section></div><div class="panel settings-section"><h2>Ztime</h2><p>Ztime 0.2.3</p></div></div></main></div></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"><div id="dialogContent"></div></dialog>
