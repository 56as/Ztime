<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Ztime 页面设计稿</title></head><body class="light" data-accent="blue" style="--accent: #007aff; --tint: color-mix(in srgb, var(--accent) 13%, var(--surface)); --on-accent: #ffffff;"><div id="app"><div class="app-shell"><aside class="sidebar"><div class="brand"><img class="brand-mark" src="./brand-icon.png" alt="" width="31" height="31"><div><strong>Ztime</strong></div></div><nav class="nav"><button data-page="home" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v11H3z M9 21v-8h6v8"></path></svg>今日</button><button data-page="week" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v17H4z M8 2v4 M16 2v4 M4 10h16 M8 14h2 M14 14h2"></path></svg>每周</button><button data-page="devices" class="active"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12H3z M8 21h8 M12 16v5"></path></svg>设备</button><button data-page="settings" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2"></path></svg>设置</button></nav></aside><main><header class="topbar page-header"><div class="page-heading"><h1>设备</h1><div class="statusbar"><span class="state"><span class="dot "></span>正在记录 · 文稿编辑器</span></div></div><div class="actions"><button data-action="refresh"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5 M4 17v-5h5 M6 7a7 7 0 0 1 12-1l2 3 M4 15l2 3a7 7 0 0 0 12-1"></path></svg> 更新</button></div></header><div class="panel"><div class="section-head"><h2>我的设备</h2><button data-action="sync">立即同步</button></div><div class="device"><span class="device-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12H3z M8 21h8 M12 16v5"></path></svg></span><div class="device-info"><strong>示例电脑</strong> <span class="tag">本机</span><div class="small">Windows</div></div></div><div class="device"><span class="device-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10v20H7z M11 18h2"></path></svg></span><div class="device-info"><strong>示例手机</strong> <div class="small">Android · 上次同步 10/31 19:00</div></div><button data-unpair="example-phone" class="ghost danger">解除配对</button></div></div><section class="panel" aria-live="polite"><p class="small">已配对设备 · 同步交互提案</p><div id="lan-ready" data-sync-state="ready"><h2>已配对</h2><p>手机和电脑连接同一局域网后，在任意一端点一次「立即同步」。</p></div><div id="lan-busy" data-sync-state="busy" hidden><h2>正在同步…</h2><p>正在更新两端的使用记录，并交换自上次成功同步以来的变化。</p></div><div id="lan-done" data-sync-state="done" hidden><h2>同步完成</h2><p>手机新增 1 条，电脑新增 1 条。两端的账本均已更新。</p></div><div id="lan-current" data-sync-state="current" hidden><h2>已是最新</h2><p>双方已完成核对，没有新的使用记录。</p></div><div id="lan-offline" data-sync-state="offline" hidden><h2>暂时无法连接手机</h2><p>请确认两台设备在可互访的局域网，且对端 Ztime 可响应。连接恢复后可以直接重试。</p><button data-action="sync-retry">重试</button></div></section><div class="panel"><h2>添加手机</h2><button data-action="pair" class="primary">生成配对二维码</button></div></main></div></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"><div id="dialogContent"></div></dialog>
</body></html>
