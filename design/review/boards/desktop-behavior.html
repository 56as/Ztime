<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行为 · Ztime</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="behavior.css"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand"><img src="brand-icon.png" class="brand-mark" alt=""><strong>Ztime</strong></div><nav class="nav"><button data-page="home">统计</button><button class="active" aria-current="page">行为</button><button data-page="devices">设备</button><button data-page="settings">设置</button></nav></aside>
<main class="behavior"><header><div><h1>行为</h1></div><button id="rules-open" data-style-native aria-expanded="false">归类规则</button></header>
<section id="purpose-rules" class="panel" hidden><h2>按应用归类</h2><p>修改默认行为后，已单独调整的时段保留你的选择。</p><div id="rule-list"></div><form id="purpose-form" data-style-native><label>新行为 <input id="purpose-name" maxlength="16" placeholder="例如：写作"></label><button>添加</button></form></section>
<section class="panel behavior-summary"><div class="behavior-head"><h2 id="chart-title">每日行为分布</h2><span id="sum"></span></div><div class="period-toolbar"><div role="group" aria-label="统计周期" id="period-modes"><button data-mode="day" data-style-native>日</button><button data-mode="week" data-style-native>周</button><button data-mode="year" data-style-native>年</button></div><div class="period-nav"><button id="prev" aria-label="上一期间" data-style-native>‹</button><label><span id="range-label"></span><input data-style-native type="date" aria-label="选择统计日期" id="anchor-date"></label><button id="next" aria-label="下一期间" data-style-native>›</button></div></div><div id="purpose-chart"></div><div id="purpose-totals" aria-label="按行为筛选时段"></div></section>
<section class="panel"><div class="behavior-head"><h2 id="sessions-heading">全部时段</h2><button id="show-all" data-style-native hidden>查看全部</button></div><div id="session-list"></div><p id="feedback" role="status" aria-live="polite"></p></section></main></div>
<script type="module" src="behavior.js"></script></body></html>
