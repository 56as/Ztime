plugins { id 'com.android.application' }
android {
    namespace 'org.timeledger.app'
    compileSdk 35
    defaultConfig { applicationId 'org.timeledger.app'; minSdk 28; targetSdk 35; versionCode 16; versionName '0.2.14' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile file('../../.tools/debug.keystore') } }
    sourceSets { main { assets.srcDirs = ["$buildDir/generated/sharedAssets"] } }
    buildTypes { release { minifyEnabled false } }
}
tasks.register('prepareSharedWeb') {
    inputs.dir("$rootDir/../web")
    inputs.dir("$rootDir/../shared")
    outputs.dir("$buildDir/generated/sharedAssets/web")
    doLast {
        copy { from "$rootDir/../web"; into "$buildDir/generated/sharedAssets/web" }
        copy { from "$rootDir/../shared"; into "$buildDir/generated/sharedAssets/web/shared" }
        def index = file("$buildDir/generated/sharedAssets/web/index.html")
        index.text = index.getText('UTF-8').replace('href="/style.css"', 'href="./style.css"').replace('src="/app.js"', 'src="./app.js"')
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareSharedWeb' }
tasks.register('createLocalDebugKey', Exec) {
    def key = rootProject.file('../.tools/debug.keystore')
    onlyIf { !key.exists() }
    outputs.file(key)
    doFirst { key.parentFile.mkdirs() }
    def suffix = System.getProperty('os.name').toLowerCase().contains('win') ? '.exe' : ''
    commandLine new File(System.getProperty('java.home'), "bin/keytool${suffix}"), '-genkeypair', '-keystore', key, '-alias', 'androiddebugkey', '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000', '-storepass', 'android', '-keypass', 'android', '-dname', 'CN=Time Ledger Development,O=Time Ledger,C=CN'
}
tasks.configureEach { if (name == 'validateSigningDebug') dependsOn 'createLocalDebugKey' }
dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
